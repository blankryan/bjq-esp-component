name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: Format & Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit and validator dependencies
        run: python -m pip install --upgrade pip pre-commit PyYAML

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  validate-and-plan:
    name: Validate Components & Plan Build Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_apps: ${{ steps.plan.outputs.has_apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip PyYAML

      - name: Validate component standards and manifests
        run: python tools/validate_components.py

      - name: Detect affected components and targets
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PLAN_JSON=$(python tools/detect_affected_components.py \
              --base-ref "${{ github.event.pull_request.base.sha }}" \
              --head-ref "${{ github.sha }}")
          else
            PLAN_JSON=$(python tools/detect_affected_components.py --all)
          fi
          echo "Build plan: ${PLAN_JSON}"
          MATRIX=$(echo "${PLAN_JSON}" | jq -c '.matrix')
          HAS_APPS=$(echo "${PLAN_JSON}" | jq -r 'if (.matrix | length) > 0 then "true" else "false" end')
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "has_apps=${HAS_APPS}" >> "$GITHUB_OUTPUT"

  docs-check:
    name: Strict Docs Check (Doxygen + MkDocs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install documentation toolchain
        run: python -m pip install --upgrade pip -r requirements-docs.txt

      - name: Build Doxygen C API reference (warnings as errors)
        run: |
          doxygen -v
          doxygen Doxyfile

      - name: Build MkDocs portal (strict)
        env:
          NO_MKDOCS_2_WARNING: "1"
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict

  build-esp-idf:
    name: Build ESP-IDF v6.1 (${{ matrix.entry.target }})
    needs: [validate-and-plan]
    if: needs.validate-and-plan.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.validate-and-plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Mark workspace as safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build examples and test_apps for ${{ matrix.entry.target }}
        shell: bash
        env:
          TARGET: ${{ matrix.entry.target }}
          APPS_JSON: ${{ toJson(matrix.entry.apps) }}
        run: |
          set -euo pipefail
          source /opt/esp/idf/export.sh
          python -m pip install --quiet "idf-build-apps>=2.4"
          mapfile -t APP_PATHS < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["APPS_JSON"])))')
          echo "Building ${#APP_PATHS[@]} app(s) for target ${TARGET}: ${APP_PATHS[*]}"
          idf-build-apps build \
            -p "${APP_PATHS[@]}" \
            -t "${TARGET}" \
            --build-dir "build_@t_@w" \
            --no-preserve \
            --check-warnings
